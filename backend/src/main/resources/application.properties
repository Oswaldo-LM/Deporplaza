spring.application.name=reservas-api

server.port = 8080

spring.datasource.url=jdbc:mysql://localhost:3307/db_reservas_canchas
spring.datasource.username=reservas_app
spring.datasource.password=reservas_dev_2026
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# ==========================
# ARCHIVOS
# ==========================

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

app.storage.root=uploads

# ==========================
# JWT
# ==========================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=120

# ==========================
# ADMIN INICIAL - DESARROLLO
# ==========================

app.bootstrap-admin.email=${ADMIN_EMAIL:}
app.bootstrap-admin.password=${ADMIN_PASSWORD:}