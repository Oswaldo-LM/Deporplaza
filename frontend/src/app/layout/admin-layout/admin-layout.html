<div class="admin-container">

  <!-- BARRA LATERAL (Sidebar) -->
  <aside class="sidebar">
    
   <div class="brand-header">
  
  <!-- Nuevo logo combinado (Ícono + Texto HTML) -->
  <div class="custom-logo">
    <!-- Asegúrate de que la extensión sea correcta (.png o .jpg) -->
    <img src="/img/logo-sintexto.png" alt="Balón DeporPlaza" class="sidebar-logo-icon">
    
    <div class="logo-typography">
      <span class="text-depor">Depor</span>
      <span class="text-plaza">Plaza</span>
    </div>
  </div>

  <h6 class="brand-title mt-4">Administración</h6>

</div>

    <nav class="nav flex-column gap-1">
      <a class="nav-link" routerLink="/admin/dashboard" routerLinkActive="active">
        <i class="bi bi-grid-1x2-fill me-2"></i> Dashboard
      </a>
      <a class="nav-link" routerLink="/admin/reservas" routerLinkActive="active">
        <i class="bi bi-calendar-check-fill me-2"></i> Reservas
      </a>
      <a class="nav-link" routerLink="/admin/reserva-presencial" routerLinkActive="active">
        <i class="bi bi-plus-circle-fill me-2"></i> Nueva reserva
      </a>
      <a class="nav-link" routerLink="/admin/pagos" routerLinkActive="active">
        <i class="bi bi-wallet2 me-2"></i> Pagos
      </a>
      <a class="nav-link" routerLink="/admin/sedes" routerLinkActive="active">
        <i class="bi bi-building-fill me-2"></i> Sedes
      </a>
      <a class="nav-link" routerLink="/admin/canchas" routerLinkActive="active">
        <i class="bi bi-layers-fill me-2"></i> Canchas
      </a>
      <a class="nav-link" routerLink="/admin/horarios" routerLinkActive="active">
        <i class="bi bi-clock-fill me-2"></i> Horarios
      </a>
    </nav>
    
  </aside>

  <!-- CONTENIDO PRINCIPAL -->
  <div class="main-content">
    
    <header class="top-header">
      <div class="user-info">
        <span class="text-muted me-2">Hola,</span>
        <strong class="text-dark">{{ usuario?.nombre || 'Administrador' }}</strong>
      </div>

      <button class="btn-logout" (click)="cerrarSesion()">
        Cerrar sesión
      </button>
    </header>

    <main class="content-area">
      <router-outlet />
    </main>

  </div>

</div>
